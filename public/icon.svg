<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Rangers">
  <title>Rangers</title>
  <style>
    /* Mirrors the app's own mark: bg-acc tile, border-stroke, text-acc-ink.
       The accent is the same orange in both themes; the stroke and the glyph
       flip so the icon keeps its edge against light and dark browser chrome. */
    .tile { fill: #F2540B; stroke: #14110D; }
    .glyph { fill: #FFF6EE; }
    @media (prefers-color-scheme: dark) {
      .tile { stroke: #EFEAE0; }
      .glyph { fill: #1A1611; }
    }
  </style>
